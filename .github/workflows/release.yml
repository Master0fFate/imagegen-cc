name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      mcpb_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/imagegen-cc.mcpb

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Package plugin folder
        run: cd dist && zip -qr ../imagegen-cc-plugin.zip imagegen-cc .claude-plugin
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/release/imagegen-cc.mcpb imagegen-cc-plugin.zip --repo "${{ github.repository }}" --generate-notes
