[package]
name = "imagegen-cc"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Master0fFate/imagegen-cc"

[dependencies]
aws-lc-rs = "1.18"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23.1"
dirs = "7.0.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "http2"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "time", "fs", "process", "sync", "net"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
